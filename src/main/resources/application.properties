spring.application.name=springboot-jpa
spring.datasource.url=jdbc:mysql://localhost:3306/db_springboot
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
#crea los esquemas de la base de datos al iniciar la aplicación(solo se recomienda para desarrollo, cuando no hay datos importantes en la base de datos o la aplicación es nueva)
#spring.jpa.hibernate.ddl-auto=create
#Actualiza los esquemas de la base de datos al iniciar la aplicación sin perder los datos existentes en desarrollo, pero no es recomendable para producción
spring.jpa.hibernate.ddl-auto=update 